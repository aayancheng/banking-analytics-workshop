<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>callout c2-make</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="../shared.css" />
    <script src="../shared.js"></script>
    <style>
      html, body { background: transparent; }
      .clip { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="c2-make" data-start="0" data-duration="8"
         data-width="1920" data-height="1080">
      <div id="scene" class="clip" data-start="0" data-duration="8" data-track-index="1">
        <div id="panel" class="lt" data-layout-allow-caption-zone>
          <div class="kicker">Three commands</div>
          <div class="body main"><code>make setup</code><span class=arrow>→</span><code>make verify</code><span class=arrow>→</span><code>make run</code></div>
          <div class="note main">install the pinned deps · the nine checks · the decision platform on port 8100</div>
        </div>
      </div>
    </div>
    <script>lowerThirdTimeline("c2-make", "#panel", 8);</script>
  </body>
</html>
