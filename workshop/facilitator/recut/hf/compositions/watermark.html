<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>watermark</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="shared.css" />
    <style>
      /* transparent page: rendered to a single PNG and composited by ffmpeg */
      html, body { background: transparent; }
      .clip { position: absolute; inset: 0; }
      #wm {
        position: absolute; right: 32px; bottom: 34px;
        display: flex; align-items: center; gap: 12px;
        padding: 8px 16px 8px 12px;
        background: rgba(26, 35, 50, 0.55);
        border-radius: 999px;
        font-size: 22px; font-weight: 600; letter-spacing: 0.01em;
        color: rgba(255, 255, 255, 0.82);
      }
      #wm .dot { width: 14px; height: 14px; border-radius: 3px; background: var(--substack); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="watermark" data-start="0" data-duration="0.04"
         data-width="1920" data-height="1080">
      <div id="scene" class="clip" data-start="0" data-duration="0.04" data-track-index="1">
        <div id="wm"><span class="dot"></span><span>teamyan.substack.com</span></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["watermark"] = tl;
    </script>
  </body>
</html>
