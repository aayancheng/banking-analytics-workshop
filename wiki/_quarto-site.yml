project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!mdd/d11-signoff.qmd"
website:
  title: "Credit Analytics You Can Verify"
  repo-url: https://github.com/aayancheng/banking-analytics-workshop
  repo-subdir: wiki
  repo-actions: [edit, issue]
  page-navigation: true
  search: true
  navbar:
    left:
      - text: Course
        href: course/index.qmd
      - text: Model Documentation
        href: mdd/index.qmd
      - text: Explain
        href: explain/index.qmd
      - text: Reference
        href: reference/index.qmd
  sidebar:
    - id: course
      title: Course
      contents:
        - course/index.qmd
        - course/c0-start.qmd
        - course/c2-score-spine.qmd
        - course/c4-governance.qmd
    - id: mdd
      title: Model Documentation
      contents:
        - mdd/index.qmd
        - mdd/d0-summary.qmd
        - mdd/d1-purpose.qmd
        - mdd/d2-data.qmd
        - mdd/d3-dependencies.qmd
        - section: "D4 Business Credit Score"
          href: mdd/score/index.qmd
          contents:
            - auto: "mdd/score/*.qmd"
        - section: "D5 Loan Adjudication"
          href: mdd/adjudication/index.qmd
          contents:
            - auto: "mdd/adjudication/*.qmd"
        - mdd/pricing/index.qmd
        - mdd/ews/index.qmd
        - mdd/line_increase/index.qmd
        - mdd/d9-implementation.qmd
        - mdd/d10-agents.qmd
    - id: explain
      title: Explain
      contents:
        - explain/index.qmd
    - id: reference
      title: Reference
      contents:
        - reference/index.qmd
        - reference/crosswalk.qmd
        - reference/glossary.qmd
        - reference/facts.qmd
        - reference/videos.qmd
format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss]
    toc: true
    code-copy: true
    mermaid:
      theme: neutral
